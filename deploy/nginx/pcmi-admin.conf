# /etc/nginx/sites-available/pcmi-admin - proposed after the 2026-09-30 pentest.
# Based on the live file; changes are marked "pentest". How to roll it out:
# deploy/nginx/README.md.

# pentest F-01: second layer of login rate limiting, per client IP (the API
# also limits per email and per IP). This file is included inside http {}.
limit_req_zone $binary_remote_addr zone=pcmi_login:10m rate=10r/m;

server {
    listen 80;
    server_name pcmi-admin.online www.pcmi-admin.online;
    server_tokens off;  # pentest F-08

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pcmi-admin.online www.pcmi-admin.online;
    server_tokens off;  # pentest F-08: no "nginx/1.24.0 (Ubuntu)" banner

    root /var/www/cms;
    index index.html index.htm index.nginx-debian.html;

    ssl_certificate /etc/letsencrypt/live/pcmi-admin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcmi-admin.online/privkey.pem;

    # pentest F-01: login gets its own location for the rate limit.
    location = /api/auth/login {
        limit_req zone=pcmi_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # pentest F-01: pass the client IP on. Without these every request
        # reaches the API from 127.0.0.1 and its per-IP login limit applies to
        # all users together. The API trusts them from loopback only.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # pentest F-08: X-XSS-Protection is deprecated and can introduce bugs; off.
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # pentest F-08
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # pentest F-03: Content-Security-Policy.
    #   script-src: only our own bundle, plus the one inline script of the print
    #     page (window.print() on load; backend/src/pdf-templates/template-renderer.ts),
    #     allowed by its hash. If that script ever changes, its hash must too.
    #   style-src: 'unsafe-inline' because the UI libraries (Radix, sonner,
    #     react-day-picker) and the print page set inline styles; Google Fonts CSS.
    #   img-src https: because print templates are stored in the database and
    #     may load images from elsewhere (QR codes from api.qrserver.com).
    #   connect-src 'self': the API is on the same origin (/api).
    #   report-uri: blocked items are logged by the API ([CSP] lines in the
    #     pm2 log; backend/src/csp-report.controller.ts).
    # Enforcing since 2026-10. To go back to report-only, rename the header to
    # Content-Security-Policy-Report-Only - see README.md.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-JvP7+dR0/uG+XdJLQ3VY1tsCgjRYmPOpus5OtsH4uU8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
}
